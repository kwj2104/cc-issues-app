# Pipeline configuration — single source of truth for tunables.
# Retrieval-layer settings mirror docs/retrieval-spec.md §3 (keep them in sync).

repo: anthropics/claude-code

# --- deterministic retrieval layer (ported from Stage 1; see docs/retrieval-spec.md) ---
weights:            # retrieval_score components
  reactions: 3.0
  comments: 1.0
  velocity: 2.0
  severity: 2.0
  demand: 1.0
  cluster: 2.0
severity:
  cap: 5.0
  label_weights:
    data-loss: 3.0
    area:security: 2.0
    regression: 2.0
    high-priority: 2.0
    perf:reliability: 1.5
    med-priority: 1.0
    "has repro": 0.5
  regex_bonus: 1.0
  regex_bank: "crash|hang|freeze|data.?loss|corrupt|segfault|CVE-\\d{4}|after updat"
demand:
  labels: [enhancement, "feature request", feature]
  min_reactions: 5
clustering:
  similarity_threshold: 0.6
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.5
  body_lead_chars: 1500
eligibility:
  exclude_labels: [duplicate, invalid, stale, autoclose, question]
  stale_rescue_min_reactions: 10
  exclude_lock_reasons: [spam, resolved]
  junk_filter: {max_clean_body_chars: 40, max_reactions: 0, max_comments: 0, min_age_days: 7}

# --- LLM classification layer ---
classifier:
  model: sonnet                 # headless `claude -p --model sonnet`
  rubric: pipeline/prompts/rubric_v2.md
  verify: pipeline/prompts/verify_v1.2.md   # veto lane + class-solo credibility bar (see header)
  output_schema: pipeline/prompts/output_schema.json
  rubric_version: v2.0
  verify_version: v1.2                       # v1.0 starved → v1.1 overcorrected → v1.2 veto+credibility
  batch_size: 20                # issues per classify call
  verify_threshold: 70          # first-pass H or score ≥ this → adversarial second pass
  catchup_per_run: 150          # backlog classification cap per scheduled run
  classify_budget_s: 600        # wall-clock budget for the classify phase of one sync. The count
                                # caps below bound the work; this bounds the TIME, which is what
                                # the job timeout actually kills on — and a killed job rolls the
                                # transaction back, losing the ingest. Stop classifying, commit.
  sync_per_run: 100             # classify cap for ONE interval sync. Without it a backlogged
                                # delta (cursor stuck → 1,500+ queued) blows both the 20-min job
                                # timeout and the subscription limit, and the whole run rolls
                                # back — including the ingest. Overflow drains via catchup.
  max_consecutive_failures: 3   # consecutive classifier errors before this run stops classifying
                                # (a usage limit fails every subsequent call; don't burn the run)
  reclassify_on: [state_reopened, title_changed, label_severity_changed]
  api_fallback: false           # true → use ANTHROPIC_API_KEY instead of subscription (escape hatch)

# --- blended ranking ---
blend:                          # final_rank_score = Σ w · norm(component)
  llm_priority: 0.45
  rate_score: 0.25
  severity: 0.20
  cluster_mass: 0.10

# --- ops ---
qa:
  weekly_sample: 20             # Sunday nightly: blind re-classification sample
  area_agreement_floor: 0.85
  high_share_band: [0.15, 0.25]
digest:
  new_high_batch_ribbon: true   # closed verified-High get a resolved ribbon in New & Notable
