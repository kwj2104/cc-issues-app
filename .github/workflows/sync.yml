name: sync
# Delta sync + LLM classification, every 2 hours.
# Odd minute (:17) dodges GitHub's top-of-the-hour scheduler congestion.
# Cadence math: 12 runs/day × ~4 min ≈ 1,450 GHA min/mo — inside the 2,000 free
# private-repo minutes. Drop to '17 */3 * * *' or make the repo public if tight.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: pipeline        # never let two pipeline runs overlap (shared with nightly/backfill)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Headroom for a catch-up run: after an outage the delta crawl alone can take ~7 min. The
    # classify phase is bounded by classifier.classify_budget_s, so a normal run is still ~4 min;
    # this ceiling only exists so a big delta commits instead of being killed mid-transaction.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code (headless classifier)
        run: npm install -g @anthropic-ai/claude-code

      - name: Delta sync, score, classify, verify, upsert
        run: python -m pipeline.sync
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
