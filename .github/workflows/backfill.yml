name: backfill
# One-time / manual jobs, run from the Actions tab in order:
#   1. census       — full crawl of the open backlog (~12k issues, ~120 API calls, minutes)
#   2. seed-import  — import the adjudicated 1,000-row review log from data/seed/
#   3. catchup      — LLM-classify the pending eligible set, ≤150 issues per invocation
#                     (re-run until the queue is empty; scheduled sync runs also drain it)
#   -  closed-history — repair job: the census is state=open, so issues closed before the first
#                     delta sync never landed. Crawls state=closed since `since` (default
#                     2026-07-11) so the dashboard's closes line is real. Already run once;
#                     only needed again if the closes line goes flat for a past window.

on:
  # Scheduled catch-up drain: 6×/day at :47 (offset from sync's :17), ~900 issues/day →
  # the highest-retrieval head is covered within a day, whole queue empty in ~8-9 days.
  # Fires mode=catchup limit=150; once pending=0 the run is a fast no-op. concurrency guards overlap.
  schedule:
    - cron: '47 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Backfill stage'
        required: true
        type: choice
        options: [census, seed-import, catchup, closed-history]
      limit:
        description: 'Max issues to classify this run (catchup only)'
        required: false
        default: '150'
      since:
        description: 'ISO date for closed-history (closed-history only)'
        required: false
        default: '2026-07-11T00:00:00Z'

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run backfill stage
        # Scheduled runs supply no inputs → default to a catchup drain of 150.
        run: python -m pipeline.backfill --mode "${{ inputs.mode || 'catchup' }}" --limit "${{ inputs.limit || '150' }}" --since "${{ inputs.since || '2026-07-11T00:00:00Z' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
